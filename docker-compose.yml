services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: assergallery-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - assergallery-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assergallery-web
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=AsserGalleryDb;User Id=sa;Password=YourStrong@Passw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=true
      - AdminUser__Email=admin@assergallery.com
      - AdminUser__Password=Admin@Asser2026!
    ports:
      - "5135:8080"
    restart: unless-stopped
    networks:
      - assergallery-network

volumes:
  sqlserver-data:
    driver: local

networks:
  assergallery-network:
    driver: bridge
